<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script defer src="script.js"></script>
</head>

<body>
    <h1 class="alignText projectTitle">Etch a sketch!</h1>
    <main>
        <div class="settingsContainer">
            <h1 class="projectTitle">Settings</h1>
            <div class="settingsButtons">
                <input class="inputColor" type="color">
                <button class="colorButtons buttonSelected">Color</button>
                <button class="colorButtons colorButtonRGB">RGB</button>
                <button class="opacityButton buttonSelected">Opacity * 1</button>
                <button class="opacity1Button">Opacity * 2</button>
                <button class="opacity2Button">Opacity * 3</button>
                <button class="maxOpacityButton">Max opacity</button>
                <input class="rangeSize" type="range" min="1" max="100">
                <button class="colorButtons resetButton">⚠️ Reset</button>
            </div>
        </div>
        <div>
            <div class="gridContainer">
            </div>
        </div>
    </main>
</body>

</html>
